name: B219 Expo SDK57 iOS and Android export preflight

on:
  pull_request:
    paths:
      - .github/workflows/b219-expo-dual-platform-release-preflight.yml
      - scripts/security/verify-expo-native-export.mjs
      - scripts/security/verify-expo-native-export.test.mjs
      - apps/mobile/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - docs/security/b219-expo-dual-platform-preflight.md

permissions:
  contents: read

concurrency:
  group: b219-expo-native-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  native-export:
    name: B219 exact-head Metro iOS and Android bundles, bounded assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout immutable PR head, no stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm candidate SHA and clean worktree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$STUDY_PROGRESS_ENABLED" = false
      - name: Use pnpm 9 from project
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node 24 from project
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install verified frozen workspace dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify portable Expo artifact validator
        run: |
          set -euo pipefail
          node --check scripts/security/verify-expo-native-export.mjs
          node --check scripts/security/verify-expo-native-export.test.mjs
          node --test scripts/security/verify-expo-native-export.test.mjs
      - name: Keep audit waivers absent
        run: pnpm security:audit-exceptions
      - name: Check native Mobile TypeScript and test suite
        run: |
          pnpm --filter @losapuntes/mobile check:types
          pnpm --filter @losapuntes/mobile test
      - name: Export actual production Metro iOS and Android bundles
        run: |
          set -euo pipefail
          pnpm --filter @losapuntes/mobile exec expo export \
            --platform all --output-dir dist --max-workers 2
      - name: Validate both bundles, signatures, bounded files and no secrets
        run: node scripts/security/verify-expo-native-export.mjs apps/mobile/dist
      - name: Confirm original source HEAD, no accidental output checked in
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

# Never publish, sign, deploy, or upload bundles here. This acceptance is
# complementary to native device builds and mandatory production audit.
