name: B222 Owner export epoch module acceptance

on:
  pull_request:
    paths:
      - .github/workflows/b222-owner-export-epoch.yml
      - apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts
      - apps/api/src/data-lifecycle/domain/account-export-assembler.ts
      - apps/api/src/data-lifecycle/domain/account-export.service.ts
      - apps/api/src/users/users.service.ts
      - docs/security/b222-owner-export-epoch-module.md

permissions:
  contents: read

concurrency:
  group: b222-owner-epoch-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  owner-epoch-contract:
    name: B222 exact-head v1/v2/v3 owner epoch and publication guards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout immutable PR head, without GitHub write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify source and release hold
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$STUDY_PROGRESS_ENABLED" = false
      - name: Use repository pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use repository Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Require exact Prettier for changed module test
        run: pnpm exec prettier --check apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts
      - name: Full strict API TypeScript and lint
        run: |
          pnpm --filter @losapuntes/api check:types
          pnpm --filter @losapuntes/api lint
      - name: Test real module composition and compatibility
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand \
            --runTestsByPath \
            src/data-lifecycle/data-lifecycle.module.spec.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/data-lifecycle/domain/account-export-assembler.spec.ts \
            src/data-lifecycle/domain/account-export.service.spec.ts
      - name: Confirm zero audit waivers
        run: pnpm security:audit-exceptions
      - name: Confirm exact SHA and clean tree after verification
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

# Dedicated acceptance is not a replacement for the canonical HIGH/CRITICAL
# audit nor live two-account and Mongo backup/restore release gate #353.
