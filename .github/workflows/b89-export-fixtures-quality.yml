name: B89 Account Export fixture strict quality
on:
  pull_request:
    paths:
      - '.github/workflows/b89-export-fixtures-quality.yml'
      - 'apps/api/src/data-lifecycle/domain/account-export-processor.spec.ts'
      - 'apps/api/src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts'
      - 'docs/engineering/b89-export-fixture-lint-recovery.md'
permissions:
  contents: read
jobs:
  scoped-export-contracts:
    name: B89 exact-head Prettier, strict ESLint and Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check exact fixture formatting
        run: |
          pnpm --filter @losapuntes/api exec prettier --check \
            src/data-lifecycle/domain/account-export-processor.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts
      - name: Enforce zero-warning strict lint
        run: |
          pnpm --filter @losapuntes/api exec eslint --max-warnings=0 \
            src/data-lifecycle/domain/account-export-processor.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts
      - name: Exercise processing/lease/cleanup regressions
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand --runTestsByPath \
            src/data-lifecycle/domain/account-export-processor.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts

  api-types:
    name: B89 whole API TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile-check entire API
        run: pnpm --filter @losapuntes/api check:types
