name: generate pnpm lock candidate

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - ".github/workflows/generate-pnpm-lock.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24 without cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate workspace lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Emit lockfile candidate
        shell: bash
        run: |
          echo "PNPM_LOCKFILE_B64_BEGIN"
          base64 -w 76 pnpm-lock.yaml
          echo "PNPM_LOCKFILE_B64_END"
