name: B84 Export and Study fixture quality

on:
  pull_request:
    paths:
      - '.github/workflows/b84-export-study-fixtures-quality.yml'
      - 'apps/api/src/data-lifecycle/domain/account-export.service.spec.ts'
      - 'apps/api/src/data-lifecycle/account-export.controller.spec.ts'
      - 'apps/api/src/study-collections/mongo/mongo-study-collection.store.spec.ts'
      - 'apps/api/src/study-collections/domain/study-collection.service.spec.ts'
permissions:
  contents: read

jobs:
  strict-fixture-quality:
    name: B84 strict fixtures, API types and Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm actual HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Source is canonically formatted
        run: |
          pnpm --filter @losapuntes/api exec prettier --check \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/domain/study-collection.service.spec.ts
      - name: Strict zero-warning ESLint
        run: |
          pnpm --filter @losapuntes/api exec eslint --max-warnings=0 \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/domain/study-collection.service.spec.ts
      - name: API typecheck
        run: pnpm --filter @losapuntes/api check:types
      - name: Focused Jest regression
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand --runTestsByPath \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/domain/study-collection.service.spec.ts
