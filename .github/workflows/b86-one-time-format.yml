name: B86 one-time pinned fixture formatter

on:
  push:
    branches:
      - tmp/b86-pinned-api-fixtures-format-20261016

permissions:
  contents: write

concurrency:
  group: b86-fixtures-once
  cancel-in-progress: false

jobs:
  format-two-fixtures:
    if: github.repository == 'Enzopinotti/losApuntes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify HEAD
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked graph
        run: pnpm install --frozen-lockfile
      - name: Format just B86 fixtures
        run: |
          pnpm --filter @losapuntes/api exec prettier --write \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: Assert path and commit on this branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r file; do
            case "$file" in
              apps/api/src/data-lifecycle/mongo/mongo-account-export.store.spec.ts|apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts) ;;
              *) echo "Unexpected formatter output $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/data-lifecycle/mongo/mongo-account-export.store.spec.ts apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts
          git commit -m 'style(test): B86 canonical Prettier for two Mongo fixtures'
          git push origin HEAD:refs/heads/tmp/b86-pinned-api-fixtures-format-20261016
