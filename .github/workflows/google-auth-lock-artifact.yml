name: google-auth-lock-artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-lock-artifact:
    if: github.head_ref == 'feat/google-auth-integration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate exact manifest and lock
        run: pnpm --filter @losapuntes/api add google-auth-library@11.1.0 --lockfile-only

      - name: Stage artifact
        run: |
          mkdir -p .tmp/google-auth-lock/apps/api
          cp apps/api/package.json .tmp/google-auth-lock/apps/api/package.json
          cp pnpm-lock.yaml .tmp/google-auth-lock/pnpm-lock.yaml

      - name: Upload exact manifest and lock
        uses: actions/upload-artifact@v7
        with:
          name: google-auth-lock
          path: .tmp/google-auth-lock
          if-no-files-found: error
          retention-days: 1
