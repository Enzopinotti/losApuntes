name: B193 password visibility browser locator contract

on:
  pull_request:
    paths:
      - scripts/auth-browser-e2e.mjs
      - scripts/test-auth-browser-password-locators.test.mjs
      - apps/web/src/features/auth/PasswordField.tsx
      - .github/workflows/ci.yml
      - .github/workflows/b193-auth-password-smoke-contract.yml
      - docs/engineering/b193-auth-browser-password-locator.md

permissions:
  contents: read

concurrency:
  group: b193-password-input-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-head-contract:
    name: B193 Node24 exact-head password locator contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
    steps:
      - name: Checkout exact immutable PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact candidate SHA and clean files
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Use canonical Node 24 without package install
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Parse browser smoke and test exact accessible-password locators
        run: |
          node --check scripts/auth-browser-e2e.mjs
          node --check scripts/test-auth-browser-password-locators.test.mjs
          node --test scripts/test-auth-browser-password-locators.test.mjs
      - name: Verify source stays immutable after contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
