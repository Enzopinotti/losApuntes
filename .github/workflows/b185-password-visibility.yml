name: B185 accessible password visibility UX

on:
  pull_request:
    paths:
      - apps/web/src/features/auth/PasswordField.tsx
      - apps/web/src/features/auth/PasswordField.scss
      - apps/web/src/features/auth/login/LoginForm.tsx
      - apps/web/src/features/auth/signup/SignUpForm.tsx
      - apps/web/src/pages/ResetPassword.tsx
      - apps/web/src/pages/Security.tsx
      - scripts/test-web-password-visibility-b185.test.mjs
      - scripts/test-web-password-visibility-b185-browser.mjs
      - .github/workflows/b185-password-visibility.yml
      - docs/contracts/b185-password-visibility.md
      - package.json
  push:
    branches:
      - feat/b185-accessible-password-visibility-20261021

permissions:
  contents: read

concurrency:
  group: b185-password-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-password-ui:
    name: B185 masked credentials, native input and Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout exact SHA without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Reproducible frozen Web workspace
        run: pnpm install --frozen-lockfile --filter los-apuntes --filter @losapuntes/web...
      - name: Credential controls security and accessibility contracts
        run: pnpm test:web-password-visibility-b185
      - name: Web native refs and TypeScript
        run: pnpm --filter @losapuntes/web check:types
      - name: Web ESLint
        run: pnpm --filter @losapuntes/web lint
      - name: Canonical Web formatting
        run: pnpm --filter @losapuntes/web format:check
      - name: Show canonical format differences on failure
        if: failure()
        run: |
          for file in src/features/auth/PasswordField.tsx src/features/auth/login/LoginForm.tsx src/features/auth/signup/SignUpForm.tsx src/pages/ResetPassword.tsx src/pages/Security.tsx; do
            pnpm --filter @losapuntes/web exec prettier "$file" > "$RUNNER_TEMP/b185-$(basename "$file")"
            diff -u "apps/web/$file" "$RUNNER_TEMP/b185-$(basename "$file")" || true
          done
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real four-journey browser acceptance
        run: node scripts/test-web-password-visibility-b185-browser.mjs
      - name: Build production Web
        run: pnpm --filter @losapuntes/web build
      - name: Confirm exact unchanged commit and clean worktree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

# Focused UI PASS never bypasses the production HIGH dependency audit and
# cannot authorize main merge or production deploy.
