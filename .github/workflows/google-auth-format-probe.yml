name: google-auth-format-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/google-auth-integration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Format Google auth files
        run: pnpm --filter @losapuntes/api exec prettier --write src/auth/google/google-auth.service.spec.ts src/auth/google/google-auth.service.ts src/auth/google/mongo-google-identity.store.ts src/auth/google/official-google-identity.provider.ts src/auth/google/schemas/google-external-identity.schema.ts src/config/runtime-environment.spec.ts src/config/runtime-environment.ts

      - name: Emit exact files
        run: |
          echo FILE_0_BEGIN
          base64 -w0 apps/api/src/auth/google/google-auth.service.spec.ts
          echo
          echo FILE_0_END
          echo FILE_1_BEGIN
          base64 -w0 apps/api/src/auth/google/google-auth.service.ts
          echo
          echo FILE_1_END
          echo FILE_2_BEGIN
          base64 -w0 apps/api/src/auth/google/mongo-google-identity.store.ts
          echo
          echo FILE_2_END
          echo FILE_3_BEGIN
          base64 -w0 apps/api/src/auth/google/official-google-identity.provider.ts
          echo
          echo FILE_3_END
          echo FILE_4_BEGIN
          base64 -w0 apps/api/src/auth/google/schemas/google-external-identity.schema.ts
          echo
          echo FILE_4_END
          echo FILE_5_BEGIN
          base64 -w0 apps/api/src/config/runtime-environment.spec.ts
          echo
          echo FILE_5_END
          echo FILE_6_BEGIN
          base64 -w0 apps/api/src/config/runtime-environment.ts
          echo
          echo FILE_6_END
