name: generate auth lock candidate

on:
  pull_request:
    paths:
      - "apps/api/package.json"
      - "apps/api/src/**/*.ts"
      - ".github/workflows/generate-auth-lock.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24 without cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install candidate dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Format API sources
        run: pnpm --filter @losapuntes/api format

      - name: Emit generated artifacts
        shell: bash
        run: |
          echo "PNPM_LOCKFILE_B64_BEGIN"
          base64 -w 76 pnpm-lock.yaml
          echo "PNPM_LOCKFILE_B64_END"
          find apps/api/src -type f -name '*.ts' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "FORMATTED_FILE_BEGIN:$file"
            base64 -w 76 "$file"
            echo "FORMATTED_FILE_END:$file"
          done
