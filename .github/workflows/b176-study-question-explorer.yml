name: B176 Web study subject question explorer

on:
  pull_request:
    paths:
      - apps/web/src/features/study/StudySubjectQuestions.tsx
      - apps/web/src/features/study/study-question-explorer.mjs
      - apps/web/src/features/study/study-question-explorer.d.mts
      - apps/web/src/pages/StudyWorkbench.tsx
      - apps/web/src/pages/StudyWorkbench.scss
      - scripts/test-web-study-workbench.mjs
      - docs/product/b176-study-subject-question-explorer-web.md
      - .github/workflows/b176-study-question-explorer.yml

permissions:
  contents: read

concurrency:
  group: b176-study-questions-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  subject-questions:
    name: Node24 exact-head contextual Q&A and Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout exact PR HEAD read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact candidate and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Read-only canonical formatting diagnostic
        shell: bash
        run: |
          pnpm --filter @losapuntes/web exec prettier src/features/study/StudySubjectQuestions.tsx > "$RUNNER_TEMP/b176.canonical.tsx"
          diff -u apps/web/src/features/study/StudySubjectQuestions.tsx "$RUNNER_TEMP/b176.canonical.tsx" || true
      - name: B176 plus Study Workbench regression contract
        run: node scripts/test-web-study-workbench.mjs
      - name: Exact-head Web TypeScript lint and format
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web format:check
      - name: Assert no worktree mutation
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
