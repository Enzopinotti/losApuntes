name: B163 Web unknown-route recovery

on:
  pull_request:
    paths:
      - apps/web/src/pages/NotFound.tsx
      - apps/web/src/pages/NotFound.scss
      - apps/web/src/app/routes.tsx
      - scripts/test-web-navigation-contract.mjs
      - scripts/test-web-not-found-browser.mjs
      - .github/workflows/b163-not-found-recovery.yml
      - docs/contracts/b163-not-found-recovery.md
  push:
    branches:
      - main
    paths:
      - apps/web/src/pages/NotFound.tsx
      - apps/web/src/pages/NotFound.scss
      - apps/web/src/app/routes.tsx
      - scripts/test-web-navigation-contract.mjs
      - scripts/test-web-not-found-browser.mjs
      - .github/workflows/b163-not-found-recovery.yml

permissions:
  contents: read

concurrency:
  group: b163-web-fallback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-web-recovery:
    name: B163 exact-head Chromium unknown-path recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CI: "true"
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen Web dependencies
        run: pnpm install --frozen-lockfile --filter los-apuntes --filter @losapuntes/web...
      - name: Static navigation fallback and privacy contract
        run: node scripts/test-web-navigation-contract.mjs
      - name: Web typecheck
        run: pnpm --filter @losapuntes/web check:types
      - name: Web strict lint
        run: pnpm --filter @losapuntes/web lint
      - name: Web canonical format
        run: pnpm --filter @losapuntes/web format:check
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real guest and member unknown-route browser tests
        run: node scripts/test-web-not-found-browser.mjs
      - name: Production Web compile
        run: pnpm --filter @losapuntes/web build
      - name: Confirm same SHA and clean tracked tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
