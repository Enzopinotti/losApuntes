name: B87 API format and lint inspection

on:
  pull_request:
    paths:
      - 'apps/api/src/**/*.ts'
      - 'apps/api/test/**/*.ts'
      - '.github/workflows/b87-api-format-quality.yml'

permissions:
  contents: read

jobs:
  api-format:
    name: Exact-head API Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate complete API formatting
        run: pnpm --filter @losapuntes/api format:check
      - name: Validate complete API types
        run: pnpm --filter @losapuntes/api check:types
      - name: Validate completion CAS guard survives canonical formatting
        run: |
          node scripts/test-account-export-b83-mongo-clock-guard.mjs
          node scripts/test-account-export-b84-mongo-claim-guard.mjs
          node scripts/test-account-export-b85-expiry-guard.mjs

  api-eslint:
    name: Strict API ESLint — independently measured
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce strict API ESLint without waivers
        run: pnpm --filter @losapuntes/api lint
