name: B122 Mongo replica account export acceptance

on:
  pull_request:
    paths:
      - .github/workflows/b122-mongo-replica-acceptance.yml
      - scripts/run-account-export-b86-local-acceptance.mjs
      - scripts/testing/b89-local-mongo-uri.mjs
      - scripts/testing/b94-mongo-acceptance-plan.mjs
      - apps/api/src/study-progress/mongo/study-progress.mongo-int.spec.ts
      - apps/api/src/data-lifecycle/**
      - apps/api/src/files/storage/**

permissions:
  contents: read

concurrency:
  group: b122-mongo-replica-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  owner-fenced-mongo-acceptance:
    name: Five real Mongo replica and mocked S3 recovery cases
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout exact PR commit, with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact source HEAD and no modified files
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pnpm 9 and Node 24
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node 24 from project version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install exact dependency lockfile for API tests
        run: pnpm install --frozen-lockfile

      - name: Validate test manifest, URI guard and runtime contract without Mongo
        run: |
          node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(2)"
          test "$STUDY_PROGRESS_ENABLED" = false
          node --test scripts/test-account-export-b89-local-mongo-uri.test.mjs scripts/test-account-export-b94-acceptance-plan.test.mjs
          node scripts/test-account-export-b94-guard.mjs

      - name: Start disposable single-node local MongoDB replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name b122-mongo-replica --rm \
            --publish 127.0.0.1:27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all --port 27017
          ready=false
          for _ in $(seq 1 60); do
            if docker exec b122-mongo-replica mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx '1'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec b122-mongo-replica mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          primary=false
          for _ in $(seq 1 40); do
            if docker exec b122-mongo-replica mongosh --quiet --eval \
              'db.adminCommand({hello:1}).isWritablePrimary' 2>/dev/null | grep -qx 'true'; then
              primary=true
              break
            fi
            sleep 2
          done
          test "$primary" = true

      - name: Execute strict B94 5-case Jest real Mongo acceptance
        env:
          STUDY_PROGRESS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          STUDY_PROGRESS_ENABLED: "false"
        run: node scripts/run-account-export-b86-local-acceptance.mjs

      - name: Verify clean checkout and exact source after Mongo tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Remove disposable MongoDB container
        if: always()
        run: |
          docker rm -f b122-mongo-replica >/dev/null 2>&1 || true
