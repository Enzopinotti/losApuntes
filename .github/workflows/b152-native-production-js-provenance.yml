name: B152 native production JS provenance

on:
  pull_request:
    paths:
      - scripts/security/check-mobile-native-bundle-provenance.mjs
      - scripts/security/check-mobile-native-bundle-provenance.test.mjs
      - .github/workflows/b152-native-production-js-provenance.yml
      - docs/security/b152-native-production-js-provenance.md
      - apps/mobile/package.json
      - apps/mobile/app.json
      - pnpm-lock.yaml
  push:
    branches:
      - main
    paths:
      - scripts/security/check-mobile-native-bundle-provenance.mjs
      - scripts/security/check-mobile-native-bundle-provenance.test.mjs
      - .github/workflows/b152-native-production-js-provenance.yml
      - apps/mobile/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: b152-native-source-map-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-client-bundle-provenance:
    name: B152 exact-head iOS Android JS source attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the canonical frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check scanner syntax and adversarial tests
        run: |
          node --check scripts/security/check-mobile-native-bundle-provenance.mjs
          node --check scripts/security/check-mobile-native-bundle-provenance.test.mjs
          node --test scripts/security/check-mobile-native-bundle-provenance.test.mjs
      - name: Produce iOS native JS bundle with source maps (never upload)
        run: |
          pnpm --filter @losapuntes/mobile exec expo export \
            --platform ios --source-maps --no-bytecode \
            --output-dir "$RUNNER_TEMP/b152-ios"
      - name: Produce Android native JS bundle with source maps (never upload)
        run: |
          pnpm --filter @losapuntes/mobile exec expo export \
            --platform android --source-maps --no-bytecode \
            --output-dir "$RUNNER_TEMP/b152-android"
      - name: Detect vulnerable packages in the actual exported native JS modules
        run: |
          node scripts/security/check-mobile-native-bundle-provenance.mjs \
            "$RUNNER_TEMP/b152-ios" "$RUNNER_TEMP/b152-android"
      - name: Keep the repository audit-exception policy closed
        run: node scripts/security/check-audit-exceptions.mjs
      - name: Reassert immutable checkout and no repository writes
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
