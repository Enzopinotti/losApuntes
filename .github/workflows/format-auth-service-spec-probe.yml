name: format-auth-service-spec-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-auth-service-spec:
    if: github.head_ref == 'feat/auth-verification-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @losapuntes/api exec prettier --write src/auth/auth.service.spec.ts
      - name: Emit exact format patch
        run: |
          echo AUTH_SERVICE_SPEC_DIFF_BEGIN
          git diff -- apps/api/src/auth/auth.service.spec.ts
          echo AUTH_SERVICE_SPEC_DIFF_END
