name: B87 one-time exact-branch API formatter

on:
  push:
    branches:
      - fix/b87-api-prettier-on-b86-integrated-20261016

permissions:
  contents: write

concurrency:
  group: b87-api-prettier
  cancel-in-progress: false

jobs:
  api-format:
    if: github.repository == 'Enzopinotti/losApuntes'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Assert checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node pinned by repository
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Reproduce frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Run API canonical Prettier
        run: pnpm --filter @losapuntes/api format
      - name: Verify style-only path scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r file; do
            if [[ ! "$file" =~ ^apps/api/(src|test)/.*\.ts$ ]]; then
              printf 'Unexpected formatting output: %s\n' "$file" >&2
              exit 1
            fi
          done < <(git diff --name-only)
          if git diff --quiet; then
            echo 'API source already matches canonical Prettier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src apps/api/test
          git commit -m 'style(api): B87 normalize B86 integrated API with pinned Prettier'
          git push origin HEAD:refs/heads/fix/b87-api-prettier-on-b86-integrated-20261016
