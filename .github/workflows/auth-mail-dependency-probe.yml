name: auth-mail-dependency-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  resolve-mail-dependency:
    if: github.head_ref == 'feat/auth-verification-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Resolve current Nodemailer dependency
        run: |
          pnpm --filter @losapuntes/api add nodemailer@latest
          pnpm --filter @losapuntes/api add -D @types/nodemailer@latest

      - name: Emit resolved package files
        run: |
          echo API_PACKAGE_B64_BEGIN
          base64 -w0 apps/api/package.json
          echo
          echo API_PACKAGE_B64_END
          echo LOCKFILE_B64_BEGIN
          base64 -w0 pnpm-lock.yaml
          echo
          echo LOCKFILE_B64_END
