name: auth-mail-dependency-probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: auth-mail-dependency-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-mail-dependency:
    if: github.head_ref == 'feat/auth-verification-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Resolve current Nodemailer dependency
        run: |
          pnpm --filter @losapuntes/api add nodemailer@latest
          pnpm --filter @losapuntes/api add -D @types/nodemailer@latest

      - name: Stage resolved dependency files
        run: |
          mkdir -p "${{ runner.temp }}/auth-mail-dependency"
          cp apps/api/package.json "${{ runner.temp }}/auth-mail-dependency/package.json"
          cp pnpm-lock.yaml "${{ runner.temp }}/auth-mail-dependency/pnpm-lock.yaml"

      - name: Upload resolved dependency files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-mail-dependency-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/auth-mail-dependency
          if-no-files-found: error
          retention-days: 1
