name: academic-format-probe

on:
  pull_request:
    paths:
      - "apps/api/src/academic/**"
      - ".github/workflows/academic-format-probe.yml"

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render canonical Prettier output
        run: |
          pnpm --filter @losapuntes/api format
          for f in             apps/api/src/academic/academic.controller.ts             apps/api/src/academic/academic.module.ts             apps/api/src/academic/domain/academic.service.ts             apps/api/src/academic/domain/academic.store.ts             apps/api/src/academic/domain/academic.types.ts             apps/api/src/academic/guards/academic-admin.guard.ts             apps/api/src/academic/mongo/academic.mongo-schemas.ts             apps/api/src/academic/mongo/mongo-academic.store.ts
          do
            echo "===== BEGIN $f ====="
            cat "$f"
            echo "===== END $f ====="
          done
