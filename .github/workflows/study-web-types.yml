name: study-web-types

on:
  pull_request:
    paths:
      - "apps/web/src/pages/StudyKits.tsx"
      - "apps/web/src/pages/StudySession.tsx"
      - "scripts/test-web-study-type-guards.mjs"
      - ".github/workflows/study-web-types.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/pages/StudyKits.tsx"
      - "apps/web/src/pages/StudySession.tsx"
      - "scripts/test-web-study-type-guards.mjs"
      - ".github/workflows/study-web-types.yml"

permissions:
  contents: read

concurrency:
  group: study-web-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study-web-typecheck:
    name: Study Web typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Verify protected study interactions
        run: node scripts/test-web-study-type-guards.mjs

      - name: Verify Web TypeScript
        run: pnpm --filter @losapuntes/web check:types
