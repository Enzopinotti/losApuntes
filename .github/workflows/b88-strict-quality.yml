name: B88 strict boundary lint recovery
on:
  pull_request:
    paths:
      - ".github/workflows/b88-strict-quality.yml"
      - ".github/workflows/b88-once-format.yml"
      - "docs/engineering/b88-boundary-lint-recovery.md"
      - "apps/api/src/study-collections/study-collections-feature.guard.ts"
      - "apps/api/src/study-progress/study-progress.feature.guard.ts"
      - "apps/api/src/study-progress/domain/study-progress.plan.ts"
      - "apps/api/src/study-progress/domain/study-progress.plan.spec.ts"
      - "apps/api/src/study-collections/mongo/study-collection-export.reader.ts"
      - "apps/api/src/study-progress/mongo/study-progress-export.reader.ts"
      - "apps/api/src/data-lifecycle/domain/account-export-versioning.spec.ts"
      - "apps/api/src/data-lifecycle/domain/account-export.service.spec.ts"
permissions:
  contents: read
concurrency:
  group: b88-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-lint:
    name: Exact-head zero-warning ESLint and Prettier on B88 sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert source HEAD
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Strict ESLint with zero warnings on B88 sources
        run: |
          pnpm --filter @losapuntes/api exec eslint \
            src/study-collections/study-collections-feature.guard.ts \
            src/study-progress/study-progress.feature.guard.ts \
            src/study-progress/domain/study-progress.plan.ts \
            src/study-progress/domain/study-progress.plan.spec.ts \
            src/study-collections/mongo/study-collection-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            --max-warnings=0
      - name: Pinned full API formatting
        run: pnpm --filter @losapuntes/api format:check
  boundary-regressions:
    name: Export v1/v2/v3, owner/Study privacy and TS
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert source HEAD
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Jest owner-only and fail-closed contracts
        run: |
          pnpm --filter @losapuntes/api exec jest \
            src/study-collections/study-collections-feature.guard.spec.ts \
            src/study-progress/study-progress.feature.guard.spec.ts \
            src/study-progress/domain/study-progress.plan.spec.ts \
            src/study-collections/mongo/study-collection-export.reader.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            --runInBand
      - name: Entire API TypeScript
        run: pnpm --filter @losapuntes/api check:types
      - name: Preserve Mongo/S3 server clock and expiry structural guards
        run: |
          node scripts/test-account-export-b83-mongo-clock-guard.mjs
          node scripts/test-account-export-b84-mongo-claim-guard.mjs
          node scripts/test-account-export-b85-expiry-guard.mjs
  global-lint:
    name: Full API ESLint mandatory debt accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert source HEAD
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Entire strict API lint
        run: pnpm --filter @losapuntes/api lint
