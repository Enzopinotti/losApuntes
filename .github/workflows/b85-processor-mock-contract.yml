name: B85 Processor Mock Contract

on:
  pull_request:
    paths:
      - ".github/workflows/b85-processor-mock-contract.yml"
      - "apps/api/src/data-lifecycle/domain/account-export-processor.spec.ts"
      - "docs/engineering/b85-processor-mocks-current-main.md"

permissions:
  contents: read

concurrency:
  group: b85-processor-mocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  processor:
    name: Exact HEAD processor Jest, lint and B82/B83 guards
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert SHA before testing
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Strict processor lint and formatter
        run: |
          pnpm --filter @losapuntes/api exec eslint src/data-lifecycle/domain/account-export-processor.spec.ts --max-warnings=0
          pnpm --filter @losapuntes/api exec prettier --check src/data-lifecycle/domain/account-export-processor.spec.ts

      - name: Full processor Jest with current Mongo and S3 fencing
        run: pnpm --filter @losapuntes/api exec jest src/data-lifecycle/domain/account-export-processor.spec.ts --runInBand

      - name: Preserve source-verified B82/B83 claim fences
        run: |
          node scripts/test-account-export-b82-fence-guard.mjs
          node scripts/test-account-export-b83-mongo-clock-guard.mjs

  api-types:
    name: Whole API TypeScript (separate mandatory gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert SHA before testing
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Entire API typecheck (never waived)
        run: pnpm --filter @losapuntes/api check:types
