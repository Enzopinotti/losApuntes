name: B90 B116 exact-head export fixture acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/b90-b116-export-fixtures.yml"
      - "apps/api/src/data-lifecycle/domain/account-export-processor.spec.ts"
      - "apps/api/src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts"
      - "apps/api/src/data-lifecycle/mongo/mongo-account-export.store.spec.ts"
      - "apps/api/src/data-lifecycle/account-export.controller.spec.ts"
      - "apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts"
      - "docs/engineering/b90-b116-fixture-quality.md"

permissions:
  contents: read

concurrency:
  group: b90-b116-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-tests:
    name: Exact-head strict five fixtures, Jest and TS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Canonical Prettier on five B90 fixture sources
        run: |
          pnpm --filter @losapuntes/api exec prettier --check \
            src/data-lifecycle/domain/account-export-processor.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: Five strict zero-warning fixtures
        run: |
          pnpm --filter @losapuntes/api exec eslint --max-warnings=0 \
            src/data-lifecycle/domain/account-export-processor.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: Five full owner/S3/Mongo Jest suites
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand --runTestsByPath \
            src/data-lifecycle/domain/account-export-processor.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: Whole API types
        run: pnpm --filter @losapuntes/api check:types

  latest-main-regressions:
    name: B114-B116 S3 integrity and HEAD regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: B114/B115/B116 source integrity guards
        run: |
          node scripts/test-account-export-b114-guard.mjs
          node scripts/test-account-export-b115-guard.mjs
          node scripts/test-account-export-b116-guard.mjs
      - name: B115 full GET and B116 strict HEAD live-node unit oracles
        run: |
          node --test \
            scripts/test-account-export-b115-full-get-length.test.mjs \
            scripts/test-account-export-b116-head.test.mjs

  full-api-lint:
    name: Whole API strict lint debt (mandatory)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Strict complete API ESLint without waivers
        run: pnpm --filter @losapuntes/api lint
