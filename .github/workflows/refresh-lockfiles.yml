name: refresh lockfiles candidate

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-lockfiles.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh lockfiles from declared ranges
        shell: bash
        run: |
          (cd apps/web && npm install --package-lock-only --ignore-scripts)
          (cd apps/api && npm install --package-lock-only --ignore-scripts)

      - name: Emit refreshed lockfiles
        shell: bash
        run: |
          echo "WEB_LOCKFILE_B64_BEGIN"
          base64 -w 76 apps/web/package-lock.json
          echo "WEB_LOCKFILE_B64_END"
          echo "API_LOCKFILE_B64_BEGIN"
          base64 -w 76 apps/api/package-lock.json
          echo "API_LOCKFILE_B64_END"
