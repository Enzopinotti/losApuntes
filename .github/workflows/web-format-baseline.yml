name: Web Formatter Baseline

on:
  pull_request:
    paths:
      - "apps/web/src/features/resources/services/resourcesService.ts"
      - "apps/web/src/features/study-collections/studyCollectionsService.ts"
      - "apps/web/src/pages/StudyCollections.tsx"
      - "apps/web/src/pages/StudyKits.tsx"
      - "apps/web/src/pages/StudyPractice.tsx"
      - "apps/web/src/pages/StudySession.tsx"
      - "apps/web/src/pages/StudyWorkbench.tsx"
      - ".github/workflows/web-format-baseline.yml"

permissions:
  contents: read

jobs:
  exact-web-format:
    name: Web baseline formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify seven previously failing Web files without rewriting
        run: |
          pnpm --filter @losapuntes/web exec prettier --check \
            src/features/resources/services/resourcesService.ts \
            src/features/study-collections/studyCollectionsService.ts \
            src/pages/StudyCollections.tsx \
            src/pages/StudyKits.tsx \
            src/pages/StudyPractice.tsx \
            src/pages/StudySession.tsx \
            src/pages/StudyWorkbench.tsx

      - name: Check Web TypeScript
        run: pnpm --filter @losapuntes/web check:types
