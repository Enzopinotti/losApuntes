name: format-auth-controller-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-auth-controller:
    if: github.head_ref == 'feat/opaque-auth-sessions-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format target file
        run: pnpm --filter @losapuntes/api exec prettier --write src/auth/auth.controller.spec.ts

      - name: Emit formatted file
        run: |
          echo AUTH_CONTROLLER_SPEC_B64_BEGIN
          base64 -w0 apps/api/src/auth/auth.controller.spec.ts
          echo
          echo AUTH_CONTROLLER_SPEC_B64_END
