name: B288 Mobile verification filter focused format
on:
  pull_request:
    paths:
      - apps/mobile/src/features/organizations/organizations-directory-screen.tsx
      - apps/mobile/src/features/organizations/organizations-controller.ts
      - apps/mobile/src/features/organizations/organizations-api.ts
      - .github/workflows/b288-mobile-verification-format.yml
permissions:
  contents: read
jobs:
  verify-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @losapuntes/mobile...
      - name: Prettier and exact diagnostic differences
        run: |
          pnpm --filter @losapuntes/mobile format:check || {
            for file in apps/mobile/src/features/organizations/organizations-directory-screen.tsx apps/mobile/src/features/organizations/organizations-controller.ts apps/mobile/src/features/organizations/organizations-api.ts; do
              pnpm --filter @losapuntes/mobile exec prettier "../../$file" | diff -u "$file" - || true
            done
            exit 1
          }
