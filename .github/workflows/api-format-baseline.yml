name: API Formatter Baseline

on:
  pull_request:
    paths:
      - "apps/api/src/**/*.ts"
      - "apps/api/test/**/*.ts"
      - ".github/workflows/api-format-baseline.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/src/**/*.ts"
      - "apps/api/test/**/*.ts"
      - ".github/workflows/api-format-baseline.yml"

permissions:
  contents: read

concurrency:
  group: api-format-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: API canonical formatter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Verify canonical API formatting without rewriting checkout
        run: pnpm --filter @losapuntes/api format:check

      - name: Verify API TypeScript
        run: pnpm --filter @losapuntes/api check:types

      - name: Verify owner-export and collection unit regressions
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand --runTestsByPath \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            src/data-lifecycle/domain/account-export-assembler.spec.ts \
            src/study-collections/domain/study-collection.service.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/study-collections-feature.guard.spec.ts
