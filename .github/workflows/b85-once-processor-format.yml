name: B85 one-time processor formatter

on:
  pull_request:
    paths:
      - ".github/workflows/b85-once-processor-format.yml"
      - "apps/api/src/data-lifecycle/domain/account-export-processor.spec.ts"

permissions:
  contents: write

concurrency:
  group: b85-once-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/b85-current-main-processor-jest-typed-mocks'
    name: Pinned formatter, exact-head own-branch lease only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Guard original source identity and remote head
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$BRANCH" = 'test/b85-current-main-processor-jest-typed-mocks'
          test -z "$(git status --porcelain)"
          git ls-remote --exit-code --heads origin "$BRANCH" | grep -F "$SHA" >/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Apply project Prettier to processor test only
        run: |
          pnpm --filter @losapuntes/api exec prettier --write src/data-lifecycle/domain/account-export-processor.spec.ts
          git diff --check
          if git diff --name-only | grep -Ev '^apps/api/src/data-lifecycle/domain/account-export-processor.spec.ts$'; then
            echo 'Unexpected formatter path' >&2
            exit 1
          fi

      - name: Publish only formatting on own branch with exact remote lease
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Formatter already clean.'
            exit 0
          fi
          git config user.name 'B85 Scope Formatter'
          git config user.email 'b85-formatter@users.noreply.github.com'
          git add -- apps/api/src/data-lifecycle/domain/account-export-processor.spec.ts
          git commit -m 'style(b85): format latest-main processor spec with project Prettier'
          test "$(git rev-parse HEAD^)" = "$SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$SHA" origin "HEAD:refs/heads/$BRANCH"

      - name: Validate file style and types on formatted tree
        run: |
          pnpm --filter @losapuntes/api exec eslint src/data-lifecycle/domain/account-export-processor.spec.ts --max-warnings=0
          pnpm --filter @losapuntes/api exec prettier --check src/data-lifecycle/domain/account-export-processor.spec.ts
          pnpm --filter @losapuntes/api exec jest src/data-lifecycle/domain/account-export-processor.spec.ts --runInBand
          pnpm --filter @losapuntes/api check:types
