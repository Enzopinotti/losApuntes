name: B86 one-time scoped fixture format

on:
  pull_request:
    paths:
      - ".github/workflows/b86-once-fixtures-format.yml"
      - "apps/api/src/data-lifecycle/mongo/mongo-account-export.store.spec.ts"
      - "apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts"

permissions:
  contents: write

concurrency:
  group: b86-once-format-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/b86-current-main-mongo-study-fixture-types'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Assert exact HEAD and single writable branch
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BRANCH" = 'fix/b86-current-main-mongo-study-fixture-types'
          test "$(git rev-parse HEAD)" = "$SHA"
          test -z "$(git status --porcelain)"
          git ls-remote --exit-code --heads origin "$BRANCH" | grep -F "$SHA" >/dev/null
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Pinned formatting for two B86 tests only
        run: |
          pnpm --filter @losapuntes/api exec prettier --write \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
          git diff --check
          if git diff --name-only | grep -Ev '^(apps/api/src/data-lifecycle/mongo/mongo-account-export.store.spec.ts|apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts)$'; then
            echo 'Unexpected formatter path' >&2
            exit 1
          fi
      - name: Push exclusively onto exact original SHA with lease
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'B86 Scoped Formatter'
          git config user.email 'b86-formatter@users.noreply.github.com'
          git add -- apps/api/src/data-lifecycle/mongo/mongo-account-export.store.spec.ts apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts
          git commit -m 'style(b86): pinned Prettier for Mongo and progress fixture specs'
          test "$(git rev-parse HEAD^)" = "$SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$SHA" origin "HEAD:refs/heads/$BRANCH"
