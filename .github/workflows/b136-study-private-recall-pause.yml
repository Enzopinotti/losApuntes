name: B136 private Study Practice pause and resume

on:
  pull_request:
    paths:
      - apps/web/src/features/study/study-recall-pause.mjs
      - apps/web/src/features/study/study-recall-pause.d.mts
      - apps/web/src/pages/StudyPractice.tsx
      - apps/web/src/pages/StudyPractice.scss
      - scripts/test-web-study-recall-pause.mjs
      - package.json
      - docs/engineering/b136-private-recall-pause.md
      - .github/workflows/b136-study-private-recall-pause.yml

permissions:
  contents: read

concurrency:
  group: b136-private-recall-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  private-pause:
    name: Node24 exact-head private recall pause and Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout exact PR head read only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate SHA and clean source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Show only formatting delta, never mutate checkout
        shell: bash
        run: |
          pnpm --filter @losapuntes/web exec prettier src/pages/StudyPractice.tsx > "$RUNNER_TEMP/StudyPractice.canonical.tsx"
          diff -u apps/web/src/pages/StudyPractice.tsx "$RUNNER_TEMP/StudyPractice.canonical.tsx" || true
      - name: Run private pause and earlier practice regressions
        run: |
          pnpm test:web-study-recall-pause
          pnpm test:web-study-recall-planning
          pnpm test:web-study-retry-round
          node scripts/test-web-study-active-recall.mjs
          node scripts/test-web-study-practice-integration.mjs
          node scripts/test-web-focused-practice-contract.mjs
      - name: Enforce Web types, strict lint and canonical formatting
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web format:check
      - name: Verify candidate unchanged
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
