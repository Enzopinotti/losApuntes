name: B88 one-time pinned Mongo fixture formatter
on:
  push:
    branches:
      - tmp/b88-mongo-fixtures-prettier-20261016
permissions:
  contents: write
jobs:
  format-mongo-acceptance-only:
    if: github.repository == 'Enzopinotti/losApuntes'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Assert checkout is exact commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier only to these Mongo tests
        run: |
          pnpm --filter @losapuntes/api exec prettier --write \
            src/study-progress/mongo/study-progress.mongo-int.spec.ts \
            src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts
      - name: Enforce exact modified-file allowlist and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              apps/api/src/study-progress/mongo/study-progress.mongo-int.spec.ts|apps/api/src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts) ;;
              *) printf 'Unexpected formatter output: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/study-progress/mongo/study-progress.mongo-int.spec.ts apps/api/src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts
          git commit -m 'style(test): B88 pin Mongo fixture Prettier on isolated helper branch'
          git push origin HEAD:refs/heads/tmp/b88-mongo-fixtures-prettier-20261016
