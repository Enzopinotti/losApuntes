name: B292 Mobile public profile activities exact-head
on:
  pull_request:
    paths:
      - apps/mobile/src/features/search/**
      - apps/mobile/src/services/api/client.ts
      - apps/mobile/test/public-profile-activities-controller.test.ts
      - apps/mobile/test/public-profile-activity-transport.test.ts
      - apps/mobile/test/public-profile-section-order-screen.test.ts
      - apps/mobile/test/search-api.test.ts
      - .github/workflows/b292-mobile-profile-activities.yml
permissions:
  contents: read
concurrency:
  group: b292-profile-activities-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-public-profile-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @losapuntes/mobile...
      - name: Verify exact source, Mobile tests, types and formatting
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          pnpm --filter @losapuntes/mobile test
          pnpm --filter @losapuntes/mobile check:types
          pnpm --filter @losapuntes/mobile format:check
      - name: Read-only formatter differences
        if: failure()
        run: |
          for file in apps/mobile/src/features/search/public-profile-activities.tsx apps/mobile/src/features/search/public-profile-activities-controller.ts apps/mobile/src/features/search/search-api.ts apps/mobile/src/features/search/search-result-screens.tsx apps/mobile/src/services/api/client.ts apps/mobile/test/public-profile-activities-controller.test.ts apps/mobile/test/public-profile-activity-transport.test.ts apps/mobile/test/public-profile-section-order-screen.test.ts apps/mobile/test/search-api.test.ts; do
            pnpm --filter @losapuntes/mobile exec prettier "../../$file" | diff -u "$file" - || true
          done
