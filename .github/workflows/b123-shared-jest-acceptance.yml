name: B123 shared Jest regression acceptance

on:
  pull_request:
    paths:
      - .github/workflows/b123-shared-jest-acceptance.yml
      - apps/api/src/files/storage/s3-object-storage.spec.ts
      - apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts
      - apps/api/src/data-lifecycle/domain/account-export-versioning.spec.ts
      - apps/api/src/study-collections/domain/study-collection.service.ts
      - apps/api/src/study-collections/domain/study-collection.service.spec.ts

permissions:
  contents: read

concurrency:
  group: b123-shared-jest-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  b123-affected-tests:
    name: Four shared API Jest suites on Node24
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout exact unmerged candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check candidate SHA before testing
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prepare pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use project Node24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Run four affected Jest suites without filters/skips
        run: |
          node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(2)"
          pnpm --filter @losapuntes/api test:ci --runTestsByPath \
            src/files/storage/s3-object-storage.spec.ts \
            src/data-lifecycle/data-lifecycle.module.spec.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/study-collections/domain/study-collection.service.spec.ts \
            --passWithNoTests=false --detectOpenHandles

      - name: Check B123 affected TypeScript formatting
        run: |
          pnpm --filter @losapuntes/api exec prettier --check \
            src/files/storage/s3-object-storage.spec.ts \
            src/data-lifecycle/data-lifecycle.module.spec.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/study-collections/domain/study-collection.service.ts

      - name: Verify source has not changed after tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
