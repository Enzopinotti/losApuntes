name: Web Question Discovery

on:
  pull_request:
    paths:
      - "apps/web/src/pages/Questions.tsx"
      - "apps/web/src/pages/Community.scss"
      - "apps/web/src/features/community/QuestionDiscoverySubjectPicker.tsx"
      - "apps/web/src/features/community/question-discovery-navigation.mjs"
      - "apps/web/src/features/community/question-discovery-navigation.d.mts"
      - "scripts/test-web-question-discovery-contract.mjs"
      - ".github/workflows/web-question-discovery.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/pages/Questions.tsx"
      - "apps/web/src/pages/Community.scss"
      - "apps/web/src/features/community/QuestionDiscoverySubjectPicker.tsx"
      - "apps/web/src/features/community/question-discovery-navigation.mjs"
      - "apps/web/src/features/community/question-discovery-navigation.d.mts"
      - "scripts/test-web-question-discovery-contract.mjs"
      - ".github/workflows/web-question-discovery.yml"

permissions:
  contents: read

concurrency:
  group: web-question-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-question-discovery:
    name: Web Question Discovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Check edited Web source formatting
        run: pnpm --filter @losapuntes/web exec prettier --check src/pages/Questions.tsx src/features/community/QuestionDiscoverySubjectPicker.tsx

      - name: Verify shareable academic question contracts
        run: node scripts/test-web-question-discovery-contract.mjs

      - name: Verify Web TypeScript
        run: pnpm --filter @losapuntes/web check:types
