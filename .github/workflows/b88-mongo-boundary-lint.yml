name: B88 safe Mongo acceptance quality
on:
  pull_request:
    paths:
      - '.github/workflows/b88-mongo-boundary-lint.yml'
      - 'apps/api/src/study-progress/mongo/study-progress.mongo-int.spec.ts'
      - 'apps/api/src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts'
      - 'scripts/test-account-export-b86-guard.mjs'
      - 'docs/engineering/b88-mongo-acceptance-safe-lint-recovery.md'
permissions:
  contents: read
jobs:
  mongo-lint:
    name: B88 exact-head strict Mongo ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier on both Mongo acceptance files
        run: |
          pnpm --filter @losapuntes/api exec prettier --check \
            src/study-progress/mongo/study-progress.mongo-int.spec.ts \
            src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts
      - name: Strict ESLint without waivers on both Mongo acceptance files
        run: |
          pnpm --filter @losapuntes/api exec eslint --max-warnings=0 \
            src/study-progress/mongo/study-progress.mongo-int.spec.ts \
            src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts
  types-and-contracts:
    name: B88 API types, Mongo safety and structural contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Whole API TypeScript
        run: pnpm --filter @losapuntes/api check:types
      - name: B83-B86 primary-clock, cleanup, S3 and opt-in gating guards
        run: |
          node scripts/test-account-export-b83-mongo-clock-guard.mjs
          node scripts/test-account-export-b84-mongo-claim-guard.mjs
          node scripts/test-account-export-b85-expiry-guard.mjs
          node scripts/test-account-export-b86-guard.mjs
      - name: Jest dedicated Mongo acceptance suites remain explicit opt-in
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand --runTestsByPath \
            src/study-progress/mongo/study-progress.mongo-int.spec.ts \
            src/study-collections/mongo/study-collection-lifecycle.mongo-int.spec.ts
