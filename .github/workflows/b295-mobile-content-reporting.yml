name: B295 Mobile organization content reports exact-head
on:
  pull_request:
    paths:
      - apps/mobile/src/features/organizations/organization-report-action.tsx
      - apps/mobile/src/features/organizations/organization-report-controller.ts
      - apps/mobile/src/features/organizations/organization-report-policy.ts
      - apps/mobile/src/features/organizations/organizations-api.ts
      - apps/mobile/src/features/organizations/organization-detail-screen.tsx
      - apps/mobile/test/organization-report-controller.test.ts
      - apps/mobile/test/organization-report-policy.test.ts
      - apps/mobile/test/organizations-api.test.ts
      - .github/workflows/b295-mobile-content-reporting.yml
permissions:
  contents: read
jobs:
  verify-mobile-organization-reporting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @losapuntes/mobile...
      - name: Mobile tests, TypeScript, lint and formatting
        run: |
          pnpm --filter @losapuntes/mobile test
          pnpm --filter @losapuntes/mobile check:types
          pnpm --filter @losapuntes/mobile lint
          pnpm --filter @losapuntes/mobile format:check
      - name: Display read-only Prettier differences on failure
        if: failure()
        run: |
          for file in apps/mobile/src/features/organizations/organization-report-controller.ts apps/mobile/src/features/organizations/organization-report-action.tsx apps/mobile/src/features/organizations/organizations-api.ts apps/mobile/src/features/organizations/organization-detail-screen.tsx apps/mobile/test/organization-report-controller.test.ts; do
            pnpm --filter @losapuntes/mobile exec prettier "../../$file" | diff -u "$file" - || true
          done
