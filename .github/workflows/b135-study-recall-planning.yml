name: B135 Study Practice review planning and private history

on:
  pull_request:
    paths:
      - apps/web/src/features/study/study-recall-planning.mjs
      - apps/web/src/features/study/study-recall-planning.d.mts
      - apps/web/src/pages/StudyPractice.tsx
      - apps/web/src/pages/StudyPractice.scss
      - scripts/test-web-study-recall-planning.mjs
      - package.json
      - docs/engineering/b135-recall-review-planning.md
      - .github/workflows/b135-study-recall-planning.yml

permissions:
  contents: read

concurrency:
  group: b135-recall-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  scheduled-recall:
    name: Node24 exact-head recall scheduling tests and Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Read-only exact PR head checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact head and clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run pure and integration regression contracts
        run: |
          pnpm test:web-study-recall-planning
          pnpm test:web-study-retry-round
          node scripts/test-web-study-active-recall.mjs
          node scripts/test-web-study-practice-integration.mjs
          node scripts/test-web-focused-practice-contract.mjs
          node scripts/test-web-study-session-integration.mjs
      - name: Check full Web TypeScript, strict lint and formatting
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web format:check
      - name: Confirm checkout remained unchanged
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
