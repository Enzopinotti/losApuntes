name: B192 private Study Progress and Web account export acceptance

on:
  pull_request:
    paths:
      - .github/workflows/b192-study-export-web-integration.yml
      - pnpm-lock.yaml
      - scripts/security/check-follow-redirects-lock.mjs
      - scripts/security/test-follow-redirects-regression.mjs
      - scripts/test-study-progress-b61-integration.mjs
      - scripts/test-account-export-b62-integration.mjs
      - apps/api/src/study-progress/study-progress.service.ts
      - apps/api/src/study-progress/study-progress.service.spec.ts
      - apps/api/src/study-progress/mongo/study-progress-export.reader.ts
      - apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts
      - docs/engineering/b192-study-redirects-read-export-integration.md

permissions:
  contents: read

concurrency:
  group: b192-study-redirects-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-head-quality:
    name: Node24 B192 Study / v3 Web account export integration
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR HEAD without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert immutable clean HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Pinned pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Pinned Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Enforce verified exact patched lock graph
        run: |
          node --check scripts/security/check-follow-redirects-lock.mjs
          node --check scripts/security/test-follow-redirects-regression.mjs
          node scripts/security/check-follow-redirects-lock.mjs
      - name: Official npm package version and integrity must match locked artifact
        run: |
          set -Eeuo pipefail
          npm view follow-redirects@1.16.1 version --json | node -e '
            let d=""; process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{if(JSON.parse(d)!=="1.16.1") process.exit(1);});
          '
          npm view follow-redirects@1.16.1 dist.integrity --json | node -e '
            let d=""; process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              const expected="sha512-FNvFGzoMLWmE6Yj9spb/zjd7yiNCHiAW9/Tg9CXrQ8wuu32HtlJOwWO11OJafl5FfY3DxTdQ0vj42zU1kvv5jg==";
              if(JSON.parse(d)!==expected) process.exit(1);
              console.log(JSON.stringify({event:"security.b191.registry_integrity",status:"MATCH",releaseAuthorized:false}));
            });
          '
      - name: Loopback regression against credential forwarding
        run: node --test scripts/security/test-follow-redirects-regression.mjs
      - name: Validate existing scoped advisory guard
        run: pnpm security:audit-exceptions
      - name: Canonical Web TypeScript and production build
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web build
      - name: Verify new Web export and v3 Study contract
        run: |
          node scripts/test-web-account-export-contract.mjs
          node scripts/test-b192-account-export-study-web.mjs
          pnpm --filter @losapuntes/web exec prettier --write \
            src/features/account-export/AccountExportPanel.tsx
          git --no-pager diff -- apps/web/src/features/account-export/AccountExportPanel.tsx
          exit 1 # TEMPORARY B192 canonical formatter diagnostic
      - name: Strict touched-file ESLint and Prettier
        run: |
          pnpm --filter @losapuntes/api exec eslint \
            src/study-progress/study-progress.service.ts \
            src/study-progress/study-progress.service.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            --max-warnings=0
          pnpm --filter @losapuntes/api exec prettier --check \
            src/study-progress/study-progress.service.ts \
            src/study-progress/study-progress.service.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: Compile all API TypeScript
        run: pnpm --filter @losapuntes/api check:types
      - name: Real Jest owner, v1 plan, guard, export and historical job suites
        run: |
          pnpm --filter @losapuntes/api test:ci --runTestsByPath \
            src/study-progress/study-progress.service.spec.ts \
            src/study-progress/domain/study-progress.plan.spec.ts \
            src/study-progress/study-progress.feature.guard.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            src/data-lifecycle/contributors/account-export-study-progress.contributor.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            --passWithNoTests=false --detectOpenHandles
      - name: Preserve original B61 and B62 source contracts
        run: |
          node scripts/test-study-progress-b61-integration.mjs
          node scripts/test-account-export-b62-integration.mjs
      - name: Confirm candidate SHA and clean working tree again
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  private-mongo-replica:
    name: B192 real Mongo7 rs0 private export and account closure
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pinned pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Pinned Node24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Start disposable local Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          test "$STUDY_PROGRESS_ENABLED" = false
          docker run -d --name b192-study-mongo --rm \
            --publish 127.0.0.1:27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all --port 27017
          ready=false
          for _ in $(seq 1 60); do
            if docker exec b192-study-mongo mongosh --quiet --eval \
              'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx 1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec b192-study-mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          primary=false
          for _ in $(seq 1 40); do
            if docker exec b192-study-mongo mongosh --quiet --eval \
              'db.adminCommand({hello:1}).isWritablePrimary' 2>/dev/null | grep -qx true; then
              primary=true
              break
            fi
            sleep 2
          done
          test "$primary" = true
      - name: Execute all B61 real Mongo cases without skipped tests
        shell: bash
        env:
          STUDY_PROGRESS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: |
          set -euo pipefail
          report="$(mktemp)"
          export B192_REPORT="$report"
          trap 'rm -f "$report"' EXIT
          pnpm --filter @losapuntes/api exec jest --runInBand \
            --runTestsByPath src/study-progress/mongo/study-progress.mongo-int.spec.ts \
            --passWithNoTests=false --detectOpenHandles \
            --json --outputFile="$report"
          node <<'B192_VERIFY'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync(process.env.B192_REPORT, 'utf8'));
          const cases = (j.testResults ?? []).flatMap(x => x.assertionResults ?? []);
          const passed = cases.filter(x => x.status === 'passed').length;
          if (j.numTotalTestSuites !== 1 || j.numPassedTestSuites !== 1 ||
              j.numFailedTests !== 0 || j.numPendingTests !== 0 ||
              j.numTotalTests < 56 || j.numPassedTests !== j.numTotalTests ||
              cases.length !== j.numTotalTests || passed !== j.numTotalTests) {
            throw new Error('B192 requires all real owner/Mongo acceptance cases, none skipped');
          }
          console.log('B192 isolated rs0 real tests PASS: ' + passed);
          B192_VERIFY
      - name: Verify exact HEAD and clean source after Mongo
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Remove disposable Mongo even on failure
        if: always()
        run: docker rm -f b192-study-mongo >/dev/null 2>&1 || true

  strict-high-audit:
    name: B192 unwaived production HIGH audit (release blocker)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Frozen-lock production audit with no waivers
        run: pnpm audit --prod --audit-level high
