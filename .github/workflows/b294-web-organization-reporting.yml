name: B294 Web organization reporting exact-head
on:
  pull_request:
    paths:
      - apps/web/src/features/organizations/OrganizationContentReportAction.tsx
      - apps/web/src/features/organizations/organization-report-controller.ts
      - apps/web/src/features/organizations/organization-report-policy.ts
      - apps/web/src/features/organizations/services/organizationsService.ts
      - apps/web/src/pages/Organization.tsx
      - apps/web/src/pages/Organizations.scss
      - scripts/test-web-organization-reporting-b294.test.mjs
      - scripts/test-web-organizations-contract.mjs
      - package.json
      - .github/workflows/b294-web-organization-reporting.yml
permissions:
  contents: read
jobs:
  verify-web-organization-reporting:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Test reporting, Web types, lint and formatting
        run: |
          pnpm test:web-organizations-contract
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web format:check
