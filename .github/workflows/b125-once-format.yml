name: B125 one-time scoped S3 spec formatter
on:
  pull_request:
    paths:
      - ".github/workflows/b125-once-format.yml"
permissions:
  contents: write
concurrency:
  group: b125-one-time-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  once:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/b125-files-resources-function-coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Assert own branch and immutable initial SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = 'test/b125-files-resources-function-coverage'
          test "$(git rev-parse HEAD)" = "$SHA"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')" = "$SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format only changed S3 Jest source
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @losapuntes/api exec prettier --write src/files/storage/s3-object-storage.spec.ts
          git diff --check
          changed="$(git diff --name-only)"
          if test -n "$changed" && test "$changed" != 'apps/api/src/files/storage/s3-object-storage.spec.ts'; then
            echo "Unexpected formatting path: $changed" >&2
            exit 1
          fi
          pnpm --filter @losapuntes/api exec prettier --check src/files/storage/s3-object-storage.spec.ts
      - name: Commit and push only to unchanged own branch
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already canonical'; exit 0
          fi
          git config user.name 'B125 Scoped Formatter'
          git config user.email 'b125-formatter@users.noreply.github.com'
          git add -- apps/api/src/files/storage/s3-object-storage.spec.ts
          git diff --cached --check
          git commit -m 'style(b125): canonical Prettier on S3 regression tests'
          test "$(git rev-parse HEAD^)" = "$SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$SHA" origin "HEAD:refs/heads/$BRANCH"
