name: B169 Study focus clock acceptance

on:
  pull_request:
    paths:
      - apps/web/src/features/study/study-focus-clock.mjs
      - apps/web/src/features/study/study-focus-clock.d.mts
      - apps/web/src/pages/StudyFocusClock.tsx
      - apps/web/src/pages/StudyFocusClock.scss
      - apps/web/src/pages/StudyWorkbench.tsx
      - scripts/test-web-study-focus-clock-b169.test.mjs
      - scripts/test-web-study-focus-clock-b169-browser.mjs
      - .github/workflows/b169-study-focus-clock.yml
      - package.json
      - docs/contracts/b169-study-focus-clock.md
  push:
    branches:
      - feat/b169-study-focus-clock-20261021

permissions:
  contents: read

concurrency:
  group: b169-focus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-study-focus:
    name: B169 exact SHA deterministic and Chromium study clock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source and clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked Web workspace
        run: pnpm install --frozen-lockfile --filter los-apuntes --filter @losapuntes/web...
      - name: Run deterministic clock transitions and contract
        run: |
          node --check scripts/test-web-study-focus-clock-b169.test.mjs
          pnpm test:web-study-focus-clock-b169
      - name: Typecheck Web
        run: pnpm --filter @losapuntes/web check:types
      - name: Lint Web
        run: pnpm --filter @losapuntes/web lint
      - name: Enforce canonical Web format
        run: pnpm --filter @losapuntes/web format:check
      - name: Show canonical component formatting diff (diagnostic only)
        if: failure()
        run: |
          pnpm --filter @losapuntes/web exec prettier src/pages/StudyFocusClock.tsx > "$RUNNER_TEMP/b169-focus-formatted.tsx"
          diff -u apps/web/src/pages/StudyFocusClock.tsx "$RUNNER_TEMP/b169-focus-formatted.tsx" || true
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real Chromium focus and session transitions
        run: node scripts/test-web-study-focus-clock-b169-browser.mjs
      - name: Build production Web
        run: pnpm --filter @losapuntes/web build
      - name: Assert original SHA and no repository modifications
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
