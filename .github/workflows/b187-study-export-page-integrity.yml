name: B187 private Study Progress export pagination integrity

on:
  pull_request:
    paths:
      - .github/workflows/b187-study-export-page-integrity.yml
      - apps/api/src/study-progress/mongo/study-progress-export.reader.ts
      - apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts
      - docs/engineering/b187-study-export-page-integrity.md

permissions:
  contents: read

concurrency:
  group: b187-study-export-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export-reader:
    name: Node24 exact-head private export reader, lint, types and Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - name: Checkout exact candidate without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact clean HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Pinned pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Pinned Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Immutable install
        run: pnpm install --frozen-lockfile
      - name: Strict targeted ESLint and Prettier
        run: |
          pnpm --filter @losapuntes/api exec eslint \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            --max-warnings=0
          pnpm --filter @losapuntes/api exec prettier --check \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: API TypeScript
        run: pnpm --filter @losapuntes/api check:types
      - name: Real Jest assertions for export reader and contributor
        run: |
          pnpm --filter @losapuntes/api test:ci --runTestsByPath \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            src/data-lifecycle/contributors/account-export-study-progress.contributor.spec.ts \
            --passWithNoTests=false --detectOpenHandles
      - name: Assert untouched exact-head tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
