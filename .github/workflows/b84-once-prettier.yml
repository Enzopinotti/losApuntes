name: B84 one-time scoped Prettier

on:
  push:
    branches:
      - fix/b84-account-export-study-fixture-eslint-20261016

permissions:
  contents: write
concurrency:
  group: b84-format-once
  cancel-in-progress: false

jobs:
  rewrite-selected-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Confirm tested SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only B84 files
        run: |
          pnpm --filter @losapuntes/api exec prettier --write \
            src/data-lifecycle/domain/account-export.service.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/domain/study-collection.service.spec.ts
      - name: Reject unapproved changes and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              apps/api/src/data-lifecycle/domain/account-export.service.spec.ts|apps/api/src/data-lifecycle/account-export.controller.spec.ts|apps/api/src/study-collections/mongo/mongo-study-collection.store.spec.ts|apps/api/src/study-collections/domain/study-collection.service.spec.ts) ;;
              *) printf 'Unapproved change: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/data-lifecycle/domain/account-export.service.spec.ts apps/api/src/data-lifecycle/account-export.controller.spec.ts apps/api/src/study-collections/mongo/mongo-study-collection.store.spec.ts apps/api/src/study-collections/domain/study-collection.service.spec.ts
          git commit -m 'style(test): B84 format four scoped fixtures with pinned Prettier'
          git push origin HEAD:refs/heads/fix/b84-account-export-study-fixture-eslint-20261016
