name: B189 reconciled private Study Progress acceptance

on:
  pull_request:
    paths:
      - .github/workflows/b189-study-private-integrated-acceptance.yml
      - apps/api/src/study-progress/study-progress.service.ts
      - apps/api/src/study-progress/study-progress.service.spec.ts
      - apps/api/src/study-progress/mongo/study-progress-export.reader.ts
      - apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts
      - docs/engineering/b189-study-private-read-export-integration.md

permissions:
  contents: read

concurrency:
  group: b189-study-private-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-head-quality:
    name: Node24 strict API + Study owner and export regression
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR HEAD without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert immutable clean HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Pinned pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Pinned Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Strict touched-file ESLint and Prettier
        run: |
          pnpm --filter @losapuntes/api exec eslint \
            src/study-progress/study-progress.service.ts \
            src/study-progress/study-progress.service.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            --max-warnings=0
          pnpm --filter @losapuntes/api exec prettier --check \
            src/study-progress/study-progress.service.ts \
            src/study-progress/study-progress.service.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts
      - name: Compile all API TypeScript
        run: pnpm --filter @losapuntes/api check:types
      - name: Real Jest owner, v1 plan, guard, export and historical job suites
        run: |
          pnpm --filter @losapuntes/api test:ci --runTestsByPath \
            src/study-progress/study-progress.service.spec.ts \
            src/study-progress/domain/study-progress.plan.spec.ts \
            src/study-progress/study-progress.feature.guard.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            src/data-lifecycle/contributors/account-export-study-progress.contributor.spec.ts \
            src/data-lifecycle/account-export.controller.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            --passWithNoTests=false --detectOpenHandles
      - name: Preserve original B61 and B62 source contracts
        run: |
          node scripts/test-study-progress-b61-integration.mjs
          node scripts/test-account-export-b62-integration.mjs
      - name: Confirm candidate SHA and clean working tree again
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  private-mongo-replica:
    name: Real loopback Mongo7 rs0 account export and closure
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pinned pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Pinned Node24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Start disposable local Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          test "$STUDY_PROGRESS_ENABLED" = false
          docker run -d --name b189-study-mongo --rm \
            --publish 127.0.0.1:27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all --port 27017
          ready=false
          for _ in $(seq 1 60); do
            if docker exec b189-study-mongo mongosh --quiet --eval \
              'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx 1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec b189-study-mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          primary=false
          for _ in $(seq 1 40); do
            if docker exec b189-study-mongo mongosh --quiet --eval \
              'db.adminCommand({hello:1}).isWritablePrimary' 2>/dev/null | grep -qx true; then
              primary=true
              break
            fi
            sleep 2
          done
          test "$primary" = true
      - name: Execute all B61 real Mongo cases without skipped tests
        shell: bash
        env:
          STUDY_PROGRESS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: |
          set -euo pipefail
          report="$(mktemp)"
          export B189_REPORT="$report"
          trap 'rm -f "$report"' EXIT
          pnpm --filter @losapuntes/api exec jest --runInBand \
            --runTestsByPath src/study-progress/mongo/study-progress.mongo-int.spec.ts \
            --passWithNoTests=false --detectOpenHandles \
            --json --outputFile="$report"
          node <<'B189_VERIFY'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync(process.env.B189_REPORT, 'utf8'));
          const cases = (j.testResults ?? []).flatMap(x => x.assertionResults ?? []);
          const passed = cases.filter(x => x.status === 'passed').length;
          if (j.numTotalTestSuites !== 1 || j.numPassedTestSuites !== 1 ||
              j.numFailedTests !== 0 || j.numPendingTests !== 0 ||
              j.numTotalTests < 56 || j.numPassedTests !== j.numTotalTests ||
              cases.length !== j.numTotalTests || passed !== j.numTotalTests) {
            throw new Error('B189 requires all real owner/Mongo acceptance cases, none skipped');
          }
          console.log('B189 isolated rs0 real tests PASS: ' + passed);
          B189_VERIFY
      - name: Verify exact HEAD and clean source after Mongo
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Remove disposable Mongo even on failure
        if: always()
        run: docker rm -f b189-study-mongo >/dev/null 2>&1 || true
