name: B80 Cross-Agent API Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/b80-reconciled-api-contract.yml"
      - "apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts"
      - "apps/api/src/data-lifecycle/domain/account-export-assembler.ts"
      - "apps/api/src/data-lifecycle/domain/account-export-contributor-allowlist.spec.ts"
      - "apps/api/src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts"
      - "apps/api/src/study-collections/domain/study-collection.service.spec.ts"
      - "apps/api/src/study-collections/domain/study-collection.service.ts"
      - "apps/api/src/study-progress/mongo/study-progress-export.reader.spec.ts"
      - "docs/engineering/b80-reconciled-api-quality-contract.md"

permissions:
  contents: read

concurrency:
  group: b80-reconciled-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: B77 on B79 main — six API acceptance suites and TS
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Enforce exact tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Six disputed API suites on reconciled current main
        run: |
          pnpm --filter @losapuntes/api exec jest \
            src/study-collections/domain/study-collection.service.spec.ts \
            src/data-lifecycle/data-lifecycle.module.spec.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/data-lifecycle/domain/account-export-contributor-allowlist.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts \
            src/study-progress/mongo/study-progress-export.reader.spec.ts \
            --runInBand

      - name: Source types
        run: pnpm --filter @losapuntes/api check:types

      - name: B79 S3 enqueue and lease contract
        run: |
          node scripts/test-account-export-b77-fences.mjs
          node scripts/test-account-export-b78-queue.mjs
          node scripts/test-account-export-b79-observability.mjs
