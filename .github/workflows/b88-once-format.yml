name: B88 once pinned scoped formatter
on:
  pull_request:
    paths:
      - ".github/workflows/b88-once-format.yml"
      - ".github/workflows/b88-strict-quality.yml"
      - "docs/engineering/b88-boundary-lint-recovery.md"
      - "apps/api/src/study-collections/study-collections-feature.guard.ts"
      - "apps/api/src/study-progress/study-progress.feature.guard.ts"
      - "apps/api/src/study-progress/domain/study-progress.plan.ts"
      - "apps/api/src/study-progress/domain/study-progress.plan.spec.ts"
      - "apps/api/src/study-collections/mongo/study-collection-export.reader.ts"
      - "apps/api/src/study-progress/mongo/study-progress-export.reader.ts"
      - "apps/api/src/data-lifecycle/domain/account-export-versioning.spec.ts"
      - "apps/api/src/data-lifecycle/domain/account-export.service.spec.ts"
permissions:
  contents: write
concurrency:
  group: b88-once-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  canonical:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/b88-api-strict-boundaries-on-b87'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Check HEAD and own remote
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = 'fix/b88-api-strict-boundaries-on-b87'
          test "$(git rev-parse HEAD)" = "$SHA"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')" = "$SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Pinned formatting on only B88 boundary sources
        run: |
          pnpm --filter @losapuntes/api exec prettier --write \
            src/study-collections/study-collections-feature.guard.ts \
            src/study-progress/study-progress.feature.guard.ts \
            src/study-progress/domain/study-progress.plan.ts \
            src/study-progress/domain/study-progress.plan.spec.ts \
            src/study-collections/mongo/study-collection-export.reader.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/data-lifecycle/domain/account-export.service.spec.ts
          git diff --check
          git diff --name-only > /tmp/b88-changed
          if grep -Ev '^apps/api/src/(study-collections/study-collections-feature.guard.ts|study-progress/study-progress.feature.guard.ts|study-progress/domain/study-progress.plan.ts|study-progress/domain/study-progress.plan.spec.ts|study-collections/mongo/study-collection-export.reader.ts|study-progress/mongo/study-progress-export.reader.ts|data-lifecycle/domain/account-export-versioning.spec.ts|data-lifecycle/domain/account-export.service.spec.ts)$' /tmp/b88-changed; then
            echo 'Unexpected formatting path' >&2
            exit 1
          fi
      - name: Commit only scoped formatting with original HEAD lease
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'B88 Scoped Formatter'
          git config user.email 'b88-formatter@users.noreply.github.com'
          git add -- apps/api/src/study-collections/study-collections-feature.guard.ts apps/api/src/study-progress/study-progress.feature.guard.ts apps/api/src/study-progress/domain/study-progress.plan.ts apps/api/src/study-progress/domain/study-progress.plan.spec.ts apps/api/src/study-collections/mongo/study-collection-export.reader.ts apps/api/src/study-progress/mongo/study-progress-export.reader.ts apps/api/src/data-lifecycle/domain/account-export-versioning.spec.ts apps/api/src/data-lifecycle/domain/account-export.service.spec.ts
          git diff --cached --check
          git commit -m 'style(b88): apply pinned Prettier to typed export and Study specs'
          test "$(git rev-parse HEAD^)" = "$SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$SHA" origin "HEAD:refs/heads/$BRANCH"
      - name: Verify complete API formatting
        run: pnpm --filter @losapuntes/api format:check
