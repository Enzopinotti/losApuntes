name: B82 format combined B81 sources once

on:
  pull_request:
    paths:
      - ".github/workflows/b82-one-time-exact-head-formatter.yml"
      - "apps/web/src/pages/StudyKits.tsx"
      - "apps/web/src/pages/StudyRunner.tsx"
      - "docs/engineering/b82-format-on-b81-integration.md"

# The only writable ref is the explicitly verified B82 head branch.
# Never merge PRs, change main, or use broad workflow write tokens.
permissions:
  contents: write

concurrency:
  group: b82-formatter-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  canonical-format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'reconcile/b82-pinned-format-on-b81-current-main'
    name: Regenerate pinned Prettier from exact B81 functional tree
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact writable B82 HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Guard source identity, writable branch and clean index
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BRANCH" = "reconcile/b82-pinned-format-on-b81-current-main"
          test -z "$(git status --porcelain)"
          git ls-remote --exit-code --heads origin "$EXPECTED_BRANCH" |
            grep -F "$EXPECTED_HEAD" >/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use pinned Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pinned Web and API formatters
        run: |
          pnpm --filter @losapuntes/web format
          pnpm --filter @losapuntes/api format
          git diff --check

      - name: Assert formatting touched only expected Web/API source files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/b82-files
          if grep -Ev '^(apps/web/src/.*\.(ts|tsx)|apps/api/(src|test)/.*\.ts)$' /tmp/b82-files; then
            echo 'Formatter modified a path outside approved Web/API source files' >&2
            exit 1
          fi
          git diff --stat
          echo "B82_FORMATTED_FILES=$(wc -l </tmp/b82-files)" >> "$GITHUB_ENV"

      - name: Commit and push formatting only onto own head with exact lease
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s /tmp/b82-files; then
            echo 'Canonical formatting already up to date.'
            exit 0
          fi
          git config user.name 'B82 Canonical Formatter'
          git config user.email 'b82-formatter@users.noreply.github.com'
          git add -- apps/web/src apps/api/src apps/api/test
          test -z "$(git diff --cached --name-only | grep -Ev '^(apps/web/src/.*\.(ts|tsx)|apps/api/(src|test)/.*\.ts)$' || true)"
          git commit -m 'style(b82): apply pinned Prettier to B81 functional tree'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/$EXPECTED_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          echo "B82_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify formatted HEAD
        run: |
          pnpm --filter @losapuntes/web format:check
          pnpm --filter @losapuntes/api format:check
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/api check:types
