name: B223 Account Export owner integrity consolidation

on:
  pull_request:
    paths:
      - .github/workflows/b223-account-export-owner-integrity.yml
      - apps/api/src/data-lifecycle/domain/account-export-assembler.ts
      - apps/api/src/data-lifecycle/domain/account-export-versioning.spec.ts
      - apps/api/src/data-lifecycle/domain/account-export-contributor-allowlist.spec.ts
      - apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts
      - apps/api/src/data-lifecycle/domain/account-export.service.ts
      - docs/security/b223-owner-integrity-current-main.md

permissions:
  contents: read

concurrency:
  group: b223-owner-integrity-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export-owner-integrity:
    name: B223 immutable-head inventory, epoch, and legacy Jest acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require matching source SHA and disabled release flag
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$STUDY_PROGRESS_ENABLED" = false
      - name: Setup locked pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install exact frozen lock
        run: pnpm install --frozen-lockfile
      - name: Check formatter for both previously independent carriers
        run: |
          pnpm exec prettier --check \
            apps/api/src/data-lifecycle/domain/account-export-assembler.ts \
            apps/api/src/data-lifecycle/domain/account-export-versioning.spec.ts \
            apps/api/src/data-lifecycle/domain/account-export-contributor-allowlist.spec.ts \
            apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts
      - name: Check all API types and strict lint
        run: |
          pnpm --filter @losapuntes/api check:types
          pnpm --filter @losapuntes/api lint
      - name: Run combined owner-sensitive export regression
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand \
            --runTestsByPath \
            src/data-lifecycle/domain/account-export-contributor-allowlist.spec.ts \
            src/data-lifecycle/domain/account-export-versioning.spec.ts \
            src/data-lifecycle/domain/account-export-assembler.spec.ts \
            src/data-lifecycle/data-lifecycle.module.spec.ts \
            src/data-lifecycle/domain/account-export.service.spec.ts
      - name: Reject any policy waiver
        run: pnpm security:audit-exceptions
      - name: Confirm exact head and clean source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

# This job deliberately cannot approve the full release. The canonical
# production HIGH/CRITICAL audit and real replica/browser/backup gates
# must pass independently; no automatic merge or deploy occurs.
