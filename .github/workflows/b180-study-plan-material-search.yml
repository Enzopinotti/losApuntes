name: B180 Web planner find and add study material

on:
  pull_request:
    paths:
      - apps/web/src/features/study/StudyPlanMaterialFinder.tsx
      - apps/web/src/features/study/study-plan-material-search.mjs
      - apps/web/src/features/study/study-plan-material-search.d.mts
      - apps/web/src/pages/StudySession.tsx
      - apps/web/src/pages/StudySession.scss
      - scripts/test-web-study-plan-material-finder.mjs
      - scripts/test-web-study-session-integration.mjs
      - docs/product/b180-study-plan-material-search-web.md
      - .github/workflows/b180-study-plan-material-search.yml

permissions:
  contents: read

concurrency:
  group: b180-plan-material-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  plan-material:
    name: Node24 exact-head study plan finder and Web gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout immutable PR HEAD read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm expected commit and clean tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Read-only canonical formatting diagnostics
        shell: bash
        run: |
          pnpm --filter @losapuntes/web exec prettier src/features/study/StudyPlanMaterialFinder.tsx > "$RUNNER_TEMP/b180.finder.canonical.tsx"
          diff -u apps/web/src/features/study/StudyPlanMaterialFinder.tsx "$RUNNER_TEMP/b180.finder.canonical.tsx" || true
          pnpm --filter @losapuntes/web exec prettier src/pages/StudySession.tsx > "$RUNNER_TEMP/b180.planner.canonical.tsx"
          diff -u apps/web/src/pages/StudySession.tsx "$RUNNER_TEMP/b180.planner.canonical.tsx" || true
      - name: Planner and material search regressions
        run: |
          node scripts/test-web-study-plan-material-finder.mjs
          node scripts/test-web-study-session-integration.mjs
          node scripts/test-web-study-handoff-integration.mjs
      - name: Verify full Web strict typing lint format and build
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web format:check
          pnpm --filter @losapuntes/web build
      - name: Assert exact candidate unchanged
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
