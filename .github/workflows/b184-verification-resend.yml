name: B184 verification email resend experience

on:
  pull_request:
    paths:
      - apps/web/src/pages/VerificationPending.tsx
      - apps/web/src/features/auth/verification-resend-safety.mjs
      - apps/web/src/features/auth/verification-resend-safety.d.mts
      - scripts/test-web-verification-resend-b184.test.mjs
      - scripts/test-web-verification-resend-b184-browser.mjs
      - docs/security/b184-verification-resend-safety.md
      - .github/workflows/b184-verification-resend.yml
      - package.json
  push:
    branches:
      - feat/b184-email-verification-resend-safety-20261021

permissions:
  contents: read

concurrency:
  group: b184-auth-resend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resend-exact-head:
    name: B184 immutable client pacing, real Chromium and Web production
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      CI: "true"
    steps:
      - name: Checkout pinned SHA without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate and pristine tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Setup pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Reproduce exact Web dependencies
        run: pnpm install --frozen-lockfile --filter los-apuntes --filter @losapuntes/web...
      - name: Verify anti-duplicate and cooldown acceptance contracts
        run: pnpm test:web-verification-resend-b184
      - name: Check Web types
        run: pnpm --filter @losapuntes/web check:types
      - name: Check Web ESLint
        run: pnpm --filter @losapuntes/web lint
      - name: Check canonical Web Prettier
        run: pnpm --filter @losapuntes/web format:check
      - name: Show read-only canonical formatting diff on failure
        if: failure()
        run: |
          pnpm --filter @losapuntes/web exec prettier src/pages/VerificationPending.tsx > "$RUNNER_TEMP/b184-formatted.tsx"
          diff -u apps/web/src/pages/VerificationPending.tsx "$RUNNER_TEMP/b184-formatted.tsx" || true
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real Chromium anti-duplicate, per-email pacing and server-error acceptance
        run: node scripts/test-web-verification-resend-b184-browser.mjs
      - name: Production Web build
        run: pnpm --filter @losapuntes/web build
      - name: Verify HEAD and no tracked side effects
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

# A green UX gate never overrides mandatory backend request limits or
# HIGH production dependency audit. No merges/deploys from this workflow.
