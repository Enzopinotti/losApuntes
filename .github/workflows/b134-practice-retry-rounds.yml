name: B134 Study Practice review-only retries

on:
  pull_request:
    paths:
      - apps/web/src/features/study/study-active-recall.mjs
      - apps/web/src/features/study/study-active-recall.d.mts
      - apps/web/src/pages/StudyPractice.tsx
      - scripts/test-web-study-retry-round.mjs
      - package.json
      - docs/engineering/b134-practice-retry-rounds.md
      - .github/workflows/b134-practice-retry-rounds.yml

permissions:
  contents: read

concurrency:
  group: b134-practice-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  practice-retry:
    name: Node24 exact-head Study Practice tests and Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      STUDY_PROGRESS_ENABLED: "false"
    steps:
      - name: Checkout exact PR head, read only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Show canonical StudyPractice formatting delta without editing checkout
        shell: bash
        run: |
          pnpm --filter @losapuntes/web exec prettier src/pages/StudyPractice.tsx > "$RUNNER_TEMP/StudyPractice.formatted.tsx"
          diff -u apps/web/src/pages/StudyPractice.tsx "$RUNNER_TEMP/StudyPractice.formatted.tsx" || true
      - name: Test retry model and UI integration
        run: |
          pnpm test:web-study-retry-round
          node scripts/test-web-study-active-recall.mjs
          node scripts/test-web-study-practice-integration.mjs
          node scripts/test-web-focused-practice-contract.mjs
      - name: Check full Web type safety, lint and canonical formatting
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web lint
          pnpm --filter @losapuntes/web format:check
      - name: Verify read-only exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
