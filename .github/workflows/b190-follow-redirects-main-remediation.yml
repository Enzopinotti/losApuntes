name: B190 official follow-redirects 1.16.1 on current main

on:
  pull_request:
    paths:
      - .github/workflows/b190-follow-redirects-main-remediation.yml
      - pnpm-lock.yaml
      - scripts/security/check-follow-redirects-lock.mjs
      - scripts/security/test-follow-redirects-regression.mjs
      - docs/security/b190-follow-redirects-main-remediation.md

permissions:
  contents: read

concurrency:
  group: b190-redirects-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  patched-redirects:
    name: Node24 npm integrity, frozen lock, real HTTP and Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - name: Checkout exact PR head without credential persistence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Immutable candidate preflight
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Pinned pnpm 9
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Pinned Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen workspace dependency install
        run: pnpm install --frozen-lockfile
      - name: Enforce verified exact patched lock graph
        run: |
          node --check scripts/security/check-follow-redirects-lock.mjs
          node --check scripts/security/test-follow-redirects-regression.mjs
          node scripts/security/check-follow-redirects-lock.mjs
      - name: Official npm package version and integrity must match locked artifact
        run: |
          set -Eeuo pipefail
          npm view follow-redirects@1.16.1 version --json | node -e '
            let d=""; process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{if(JSON.parse(d)!=="1.16.1") process.exit(1);});
          '
          npm view follow-redirects@1.16.1 dist.integrity --json | node -e '
            let d=""; process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              const expected="sha512-FNvFGzoMLWmE6Yj9spb/zjd7yiNCHiAW9/Tg9CXrQ8wuu32HtlJOwWO11OJafl5FfY3DxTdQ0vj42zU1kvv5jg==";
              if(JSON.parse(d)!==expected) process.exit(1);
              console.log(JSON.stringify({event:"security.b190.registry_integrity",status:"MATCH",releaseAuthorized:false}));
            });
          '
      - name: Loopback regression against credential forwarding
        run: node --test scripts/security/test-follow-redirects-regression.mjs
      - name: Validate existing scoped advisory guard
        run: pnpm security:audit-exceptions
      - name: Canonical Web TypeScript and production build
        run: |
          pnpm --filter @losapuntes/web check:types
          pnpm --filter @losapuntes/web build
      - name: Source and lockfile unchanged after tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  strict-high-audit:
    name: B190 strict production HIGH audit, expected to remain blocking if unresolved
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Frozen-lock production audit with no waivers
        run: pnpm audit --prod --audit-level high
