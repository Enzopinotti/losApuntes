name: auth-hardening-coverage-probe

on:
  push:
    branches:
      - hardening/identity-auth-maturity-2026

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure critical Identity/Auth coverage
        run: >
          pnpm --filter @losapuntes/api exec jest --runInBand --coverage
          --coverageReporters=text
          --coverageReporters=text-summary
          --collectCoverageFrom=auth/auth.service.ts
          --collectCoverageFrom=auth/account-security.service.ts
          --collectCoverageFrom=auth/password.service.ts
          --collectCoverageFrom=auth/password-policy.ts
          --collectCoverageFrom=auth/action-token/auth-action-token.service.ts
          --collectCoverageFrom=auth/session/auth-session.service.ts
          --collectCoverageFrom=auth/session/session-credential.ts
          --collectCoverageFrom=auth/session/session-cookie.ts
          --collectCoverageFrom=auth/session/session-token.ts
          --collectCoverageFrom=auth/guards/auth-session.guard.ts
          --collectCoverageFrom=auth/guards/csrf-origin.guard.ts
          --collectCoverageFrom=auth/lifecycle/auth-lifecycle.service.ts
          --collectCoverageFrom=auth/google/google-auth.service.ts
          --collectCoverageFrom=auth/google/google-oauth-attempt.service.ts
          --collectCoverageFrom=auth/google/google-proof.ts
