name: Temporary candidate lockfile resolution
on:
  push:
    branches:
      - fix/deps-high-partial-remediation-20261111
    paths:
      - .github/workflows/candidate-lock-resolution-20261111.yml
permissions:
  contents: read
jobs:
  resolve-candidate:
    name: Resolve candidate only (read-only token, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout candidate without token persistence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup repository pnpm version
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Resolve actual dependency graph with no package lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Emit exact lockfile patch for external review
        run: |
          test -n "$(git diff -- pnpm-lock.yaml)"
          git diff --check
          echo LOCK_DIFF_BEGIN_20261111
          git diff --no-ext-diff --no-color --unified=3 -- pnpm-lock.yaml
          echo LOCK_DIFF_END_20261111
      - name: Prove resolved frozen lockfile acceptance
        run: pnpm install --frozen-lockfile --ignore-scripts
