name: B131 full API lint closeout and security regressions

on:
  pull_request:
    paths:
      - .github/workflows/b131-api-lint-closeout.yml
      - apps/api/src/**
      - docs/engineering/b131-api-lint-closeout.md

permissions:
  contents: read

concurrency:
  group: b131-api-lint-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  strict-api:
    name: Node24 full API strict ESLint zero warnings, format and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify SHA before tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Temporary canonical formatter capture for touched B131 sources
        run: |
          pnpm --filter @losapuntes/api exec prettier --write \
            src/data-lifecycle/domain/account-export-assembler.spec.ts \
            src/data-lifecycle/domain/account-export.service.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/data-lifecycle/storage/account-export-artifact-storage.spec.ts \
            src/files/storage/s3-multipart-initiation.ts \
            src/files/storage/s3-multipart-part-etag.ts \
            src/files/storage/s3-object-storage.ts \
            src/files/storage/s3-signed-request-headers.ts \
            src/study-collections/domain/study-collection.service.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/mongo/study-collection-export.reader.ts \
            src/study-collections/study-collections-feature.guard.ts \
            src/study-progress/domain/study-progress.plan.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/study-progress.feature.guard.ts
          node <<'B131_CAPTURE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const paths = execFileSync('git', ['diff', '--name-only', '--', 'apps/api/src'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if (paths.length === 0) throw new Error('B131 expected formatter differences');
          console.log('B131_CHANGED_COUNT ' + paths.length);
          for (const path of paths) {
            if (!path.startsWith('apps/api/src/')) throw new Error('Unexpected path');
            const base64 = fs.readFileSync(path).toString('base64');
            console.log('B131_FMT_BEGIN ' + path);
            for (const part of base64.match(/.{1,1200}/gu) ?? []) console.log('B131_FMT_CHUNK ' + part);
            console.log('B131_FMT_END ' + path);
          }
          B131_CAPTURE
      - name: Full unmodified strict API ESLint
        run: pnpm --filter @losapuntes/api lint
      - name: Full API canonical Prettier
        run: pnpm --filter @losapuntes/api format:check
      - name: Full API TypeScript
        run: pnpm --filter @losapuntes/api check:types
      - name: All Web and Mobile formatting remains green
        run: |
          pnpm --filter @losapuntes/web format:check
          pnpm --filter @losapuntes/mobile format:check
      - name: Confirm checkout was not mutated
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  security-regression:
    name: Node24 all related Jest suites and S3 source contract guards
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      CI: 'true'
      STUDY_PROGRESS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: All directly related API Jest suites without suppressions
        run: |
          pnpm --filter @losapuntes/api exec jest --runInBand --findRelatedTests \
            src/data-lifecycle/domain/account-export-assembler.spec.ts \
            src/data-lifecycle/domain/account-export.service.ts \
            src/data-lifecycle/mongo/mongo-account-export-orphan-cleanup.store.spec.ts \
            src/data-lifecycle/mongo/mongo-account-export.store.spec.ts \
            src/data-lifecycle/storage/account-export-artifact-storage.spec.ts \
            src/files/storage/s3-multipart-initiation.ts \
            src/files/storage/s3-multipart-part-etag.ts \
            src/files/storage/s3-object-storage.ts \
            src/files/storage/s3-signed-request-headers.ts \
            src/study-collections/domain/study-collection.service.spec.ts \
            src/study-collections/mongo/mongo-study-collection.store.spec.ts \
            src/study-collections/mongo/study-collection-export.reader.ts \
            src/study-collections/study-collections-feature.guard.ts \
            src/study-progress/domain/study-progress.plan.ts \
            src/study-progress/mongo/study-progress-export.reader.ts \
            src/study-progress/study-progress.feature.guard.ts \
            --passWithNoTests=false --detectOpenHandles
      - name: Strict independent B115 and B116 S3 guard contracts
        run: |
          node scripts/test-account-export-b115-guard.mjs
          node scripts/test-account-export-b116-guard.mjs
          node --test scripts/test-account-export-b115-full-get-length.test.mjs scripts/test-account-export-b116-head.test.mjs
      - name: Verify exact source remains clean
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
