name: Account Export V3 Epoch Fixture

on:
  pull_request:
    paths:
      - ".github/workflows/account-export-v3-epoch-fixture.yml"
      - "apps/api/src/data-lifecycle/data-lifecycle.module.spec.ts"
      - "apps/api/src/data-lifecycle/domain/account-export-assembler.ts"
      - "apps/api/src/data-lifecycle/domain/account-export.service.ts"

permissions:
  contents: read

concurrency:
  group: account-export-v3-epoch-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epoch-fixture:
    name: V3 module wiring and fail-closed export
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify HEAD identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify real account-export module wiring
        run: pnpm --filter @losapuntes/api exec jest src/data-lifecycle/data-lifecycle.module.spec.ts --runInBand

      - name: Verify owner epoch contract
        run: node scripts/test-account-export-b64-epoch-fence.mjs

      - name: Typecheck API
        run: pnpm --filter @losapuntes/api check:types
