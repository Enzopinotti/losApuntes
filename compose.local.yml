services:
  mongo:
    image: mongo:8.0
    restart: "no"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { if (db.hello().isWritablePrimary) quit(0); rs.status(); quit(2); } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(2); }",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/losapuntes_local?replicaSet=rs0&directConnection=true
      WEB_ORIGIN: http://localhost:5173
      SWAGGER_ENABLED: "false"
      AUTH_EMAIL_DELIVERY_MODE: smtp
      AUTH_ACTION_BASE_URL: http://localhost:5173
      AUTH_EMAIL_FROM: Los Apuntes <no-reply@losapuntes.local>
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      AUTH_SMTP_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
