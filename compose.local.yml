services:
  mongo:
    image: mongo:8.0
    restart: "no"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { if (db.hello().isWritablePrimary) quit(0); rs.status(); quit(2); } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(2); }",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: "no"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: losapuntes-local
      RUSTFS_SECRET_KEY: losapuntes-local-files-secret
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0770
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  rustfs-init:
    image: rustfs/rc:v0.1.30
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      RUSTFS_ACCESS_KEY: losapuntes-local
      RUSTFS_SECRET_KEY: losapuntes-local-files-secret
    command:
      - >
        /usr/bin/rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY"
        "$$RUSTFS_SECRET_KEY" >/dev/null &&
        /usr/bin/rc mb --ignore-existing local/losapuntes-files >/dev/null
    depends_on:
      rustfs:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      DEPLOYMENT_PROFILE: local
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/losapuntes_local?replicaSet=rs0&directConnection=true
      WEB_ORIGIN: http://localhost:5173
      SWAGGER_ENABLED: "false"
      AUTH_EMAIL_DELIVERY_MODE: smtp
      AUTH_ABUSE_KEY_SECRET: losapuntes-local-auth-abuse-secret-2026
      AUTH_ACTION_BASE_URL: http://localhost:5173
      AUTH_EMAIL_FROM: Los Apuntes <no-reply@losapuntes.local>
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      AUTH_SMTP_SECURE: "false"
      FILES_STORAGE_PROVIDER: s3
      FILES_S3_ENDPOINT: http://rustfs:9000
      FILES_S3_PUBLIC_ENDPOINT: http://localhost:9000
      FILES_S3_REGION: us-east-1
      FILES_S3_BUCKET: losapuntes-files
      FILES_S3_ACCESS_KEY_ID: losapuntes-local
      FILES_S3_SECRET_ACCESS_KEY: losapuntes-local-files-secret
      FILES_DOWNLOAD_URL_TTL_SECONDS: "2"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  files-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["node", "dist/files/files-cleanup.worker.js"]
    environment:
      NODE_ENV: production
      DEPLOYMENT_PROFILE: local
      MONGO_URI: mongodb://mongo:27017/losapuntes_local?replicaSet=rs0&directConnection=true
      WEB_ORIGIN: http://localhost:5173
      SWAGGER_ENABLED: "false"
      AUTH_EMAIL_DELIVERY_MODE: smtp
      AUTH_ABUSE_KEY_SECRET: losapuntes-local-auth-abuse-secret-2026
      AUTH_ACTION_BASE_URL: http://localhost:5173
      AUTH_EMAIL_FROM: Los Apuntes <no-reply@losapuntes.local>
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      AUTH_SMTP_SECURE: "false"
      FILES_STORAGE_PROVIDER: s3
      FILES_S3_ENDPOINT: http://rustfs:9000
      FILES_S3_PUBLIC_ENDPOINT: http://localhost:9000
      FILES_S3_REGION: us-east-1
      FILES_S3_BUCKET: losapuntes-files
      FILES_S3_ACCESS_KEY_ID: losapuntes-local
      FILES_S3_SECRET_ACCESS_KEY: losapuntes-local-files-secret
      FILES_CLEANUP_INTERVAL_MS: "1000"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
